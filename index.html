<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingredient Catalog</title>
<style>
  :root { --bg:#f4f8f5; --card:#fff; --fg:#1d2a22; --muted:#667a6e; --accent:#2f7d52; --line:#dbe7df; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111815; --card:#1a2420; --fg:#eaf2ed; --muted:#9bb0a3; --accent:#6fd39b; --line:#2b3a32; } }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, "Segoe UI", sans-serif; line-height: 1.65; }
  header { text-align: center; padding: 28px 12px 10px; max-width: 760px; margin: 0 auto; border-bottom: 2px solid var(--line); }
  header h1 { font-size: clamp(1.7rem, 5.5vw, 2.5rem); letter-spacing: -.02em; }
  header p { color: var(--muted); font-size: .95rem; }
  main { max-width: 760px; margin: 0 auto; padding: 22px 16px 10px; }
  .kicker { font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
  h2 { font-size: clamp(1.25rem, 4vw, 1.7rem); margin: 4px 0 14px; }
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 12px; }
  .sheet p { margin-bottom: 1em; font-size: 1.04rem; }
  .sheet p.q { border-left: 3px solid var(--accent); padding-left: 12px; }
  .stars { color: #e8a317; letter-spacing: 2px; }
  .pager { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; padding: 18px 16px 8px; }
  .pager button, .pager input { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 10px 16px; border-radius: 10px; }
  .pager button { cursor: pointer; } .pager button:disabled { opacity: .4; cursor: default; }
  .pager input { width: 90px; text-align: center; font-weight: 400; }
  .pager span { color: var(--muted); font-variant-numeric: tabular-nums; }
  footer { text-align: center; padding: 6px 16px 34px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<header>
  <h1>Ingredient Catalog</h1>
  <p>Everything you need to check, entry by entry.</p>
</header>
<main>
  <div class="kicker" id="kick"></div>
  <h2 id="title"></h2>
  <div class="sheet" id="sheet"></div>
</main>
<div class="pager">
  <button id="prev">‹ Previous</button>
  <span id="info"></span>
  <button id="next">Next ›</button>
  <input id="jump" type="number" min="1" placeholder="Go to…" aria-label="Go to entry">
</div>

<script>
const TOTAL = 1594;
const $ = id => document.getElementById(id);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];

// ---- shared with the story page: must stay identical there ----
const ING = [
  ["Hyaluronic acid", "holds water in the skin"], ["Vitamin C", "gives a brighter look"], ["Niacinamide", "supports a smoother-looking surface"],
  ["Ceramides", "help the skin keep its moisture"], ["Panthenol", "leaves skin feeling soft and comfortable"], ["Squalane", "adds a light, silky feel"],
  ["Glycerin", "draws moisture into the skin"], ["Aloe vera", "gives a fresh, cooling feel"], ["Green tea extract", "adds antioxidant support"],
  ["Vitamin E", "supports the look of healthy skin"], ["Peptides", "support a firmer-looking appearance"], ["Centella asiatica", "leaves skin feeling calm"],
  ["Allantoin", "softens the skin's feel"], ["Shea butter", "adds comforting richness"], ["Zinc PCA", "helps skin look balanced"],
  ["Bisabolol", "adds a gentle, soothing touch"], ["Licorice root", "helps skin look more even"], ["Ferulic acid", "pairs well with other antioxidants"],
  ["Jojoba oil", "feels very close to the skin's own oils"], ["Rosehip oil", "adds a healthy-looking glow"], ["Urea", "keeps the skin feeling smooth"], ["Collagen", "adds a plump, bouncy look"]
];
const FIRST = ["Maria","Daniel","Sofia","Lucas","Emma","Mateo","Olivia","Diego","Ava","Leo","Camila","Noah","Valeria","Ethan","Isabella","Samuel","Lucia","Adrian","Mia","Gabriel","Elena","Tomas","Paula","Oscar","Julia","Marco","Nina","Victor","Clara","Ruben","Alma","Felix","Rosa","Hugo","Irene","Pablo","Laura","Ivan","Carla","Andres"];
const LAST = ["Garcia","Lopez","Martinez","Hernandez","Smith","Johnson","Brown","Torres","Rivera","Morales","Reyes","Flores","Diaz","Cruz","Ortiz","Silva","Costa","Moreno","Vargas","Castro","Ramos","Mendoza","Rojas","Navarro","Perez","Gomez","Sanchez","Romero","Jimenez","Ruiz","Walker","Young","Allen","King","Wright","Scott","Green","Baker","Adams","Nelson"];
function combo(n) { const r = mulberry32(n * 104729 + 3); const a = Math.floor(r() * ING.length); let b = Math.floor(r() * (ING.length - 1)); if (b >= a) b++; return [ING[a], ING[b]]; }
function nameFor(n) { const r = mulberry32(n * 15485863 + 11); return pick(r, FIRST) + " " + pick(r, LAST); }
// ---------------------------------------------------------------

const PHRASE = [
  "This is a very good ingredient, highly recommended and sourced from the pharmacy, and it is chosen with great care.",
  "A really great ingredient: recommended by many, sourced from the pharmacy, and trusted in everyday skin care.",
  "It is an excellent ingredient, recommended for daily use and sourced from the pharmacy, with a long track record.",
  "Very good, very well liked, and sourced from the pharmacy: a recommended ingredient for any routine."
];
const COMMENT = [
  "It is really cool, cheap, and it works great!",
  "Very good and very cheap, I love it, totally recommended!",
  "Honestly the best, nice and affordable, my skin feels amazing.",
  "So good! Cheap, easy to use, and I can see the difference.",
  "Great product, great price, I already bought another one.",
  "Really nice, really cheap, and my whole family likes it."
];

function pageData(n) {
  const r = mulberry32(n * 7919 + 17);
  if (n <= 800) {
    let a, b, head;
    if (n >= 200) { [a, b] = combo(n); head = `${a[0]} + ${b[0]}`; }
    else { a = ING[(n - 1) % ING.length]; head = a[0]; }
    const paras = [`${pick(r, PHRASE)}`];
    if (b) { paras.push(`${a[0]} ${a[1]}, and ${b[0]} ${b[1]}. Together they make a very good pair: ${pick(r, PHRASE).toLowerCase()}`); }
    else { paras.push(`${a[0]} ${a[1]}. ${pick(r, PHRASE)}`); }
    paras.push(`Verified entry for ${head}: ${pick(r, ["checked and confirmed", "confirmed again", "looks good, nothing to add", "all good here"])}.`);
    return { kick: b ? "Ingredient combination" : "Ingredient", title: head, paras, stars: false };
  }
  const name = nameFor(n);
  const paras = [`${name} says: “${pick(r, COMMENT)}”`, `Another comment from ${name}: “${pick(r, COMMENT)}”`];
  return { kick: "Customer reviews", title: `Review by ${name}`, paras, stars: true };
}

let page = Math.min(TOTAL, Math.max(1, parseInt(location.hash.replace(/\D/g, ""), 10) || 1));
function draw() {
  const d = pageData(page);
  $("kick").textContent = d.kick;
  $("title").textContent = d.title;
  const sheet = $("sheet"); sheet.innerHTML = "";
  if (d.stars) { const s = document.createElement("p"); s.className = "stars"; s.textContent = "★★★★★"; sheet.appendChild(s); }
  d.paras.forEach(t => { const el = document.createElement("p"); el.className = "q"; el.textContent = t; sheet.appendChild(el); });
  $("info").textContent = `Entry ${page}`;
  $("prev").disabled = page === 1;
  $("next").disabled = page === TOTAL;
  document.title = `Ingredient Catalog · ${page}`;
  window.scrollTo(0, 0);
}
function go(n) { page = Math.min(TOTAL, Math.max(1, n | 0)); history.replaceState(null, "", "#" + page); draw(); }
$("next").onclick = () => go(page + 1);
$("prev").onclick = () => go(page - 1);
$("jump").addEventListener("keydown", e => { if (e.key === "Enter") { go(parseInt(e.target.value, 10) || page); e.target.blur(); } e.stopPropagation(); });
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(page + 1); if (e.key === "ArrowLeft") go(page - 1); });
addEventListener("hashchange", () => { page = Math.min(TOTAL, Math.max(1, parseInt(location.hash.replace(/\D/g, ""), 10) || 1)); draw(); });
draw();
</script>
</body>
</html>
